name: PettingZoo AEC compatibility

on:
  push:
    branches:
      - feature/pettingzoo-aec-mec
  pull_request:
    paths:
      - "pettingzoo_mec/**"
      - "examples/**"
      - "tests/**"
      - "pyproject.toml"
      - "PETTINGZOO.md"
      - ".github/workflows/pettingzoo-aec.yml"
  workflow_dispatch:

jobs:
  aec-api:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "${{ matrix.python-version }}"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q tests/test_pettingzoo_aec.py
      - run: python examples/rollout_aec.py

  cpu-learning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - name: Install CPU-only PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[train,test]"
      - run: python -m pytest -q tests/test_offloading_agent.py
      - run: python examples/train_aec.py --episodes 2 --horizon 3 --batch-size 4
